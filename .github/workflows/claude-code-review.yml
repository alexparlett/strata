name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# One review per PR at a time. A new push supersedes the in-flight run rather
# than paying for two reviews of overlapping diffs.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped; ready_for_review picks them up when they are marked ready.
    #
    # Dependabot is skipped too, and deliberately as a job condition rather than by
    # passing `allowed_bots` to the action below. claude-code-action refuses a run
    # initiated by a bot (`Workflow initiated by non-human actor`), and that refusal is
    # a hard failure, so every version-bump PR sat red on a check that was never going
    # to do anything: the diff is a manifest line and a lockfile, the reviewer cannot
    # read the upstream changelog that would make the bump judgeable, and the thing
    # that actually judges a bump is `cargo test` in ci.yml. A skipped job reports as
    # skipped, which satisfies a required status check; allowing the bot instead would
    # run a `pull-requests: write` action on a branch no human authored, which is the
    # case that check exists for.
    if: >-
      github.event.pull_request.draft == false
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # Where this review starts. Every run that actually posts a summary ends it
      # with a `<!-- claude-review-sha: ... -->` marker naming the head it covered,
      # so the next push only has to look at what arrived since.
      #
      # The marker, and not `github.event.before`, is the source of truth: `before`
      # says what the branch used to point at, which is a lie for every push that
      # did not get reviewed - a draft, a run this workflow's `cancel-in-progress`
      # superseded, a run that died at its turn limit before posting. Each of those
      # would skip a commit permanently, silently. A marker exists only where a
      # review was published, so the range always starts at code a human has seen.
      #
      # `compare` both validates the marker and decides the rebase case: only
      # `ahead` - the marked commit is still an ancestor of this head - is
      # incremental. A force-push that rewrote history reports `diverged`, and then
      # we review the whole PR again rather than hand the reviewer a range full of
      # phantom reverts. Anything unexpected (deleted commit, API failure) falls
      # the same way, so the degraded mode is always "review too much", never
      # "review nothing".
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          last=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                   --jq '.[] | select(.user.type == "Bot") | .body' \
                 | grep -oE '<!-- claude-review-sha: [0-9a-f]{40} -->' \
                 | tail -n1 | grep -oE '[0-9a-f]{40}' || true)

          # Re-triggered without a new commit (a draft toggled ready after a review
          # already ran). There is nothing to look at.
          if [ "$last" = "$HEAD_SHA" ]; then
            echo "$HEAD_SHA has already been reviewed; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base=""
          if [ -n "$last" ]; then
            status=$(gh api "repos/$REPO/compare/$last...$HEAD_SHA" --jq .status || echo "")
            if [ "$status" = "ahead" ]; then
              base="$last"
              echo "Incremental review: $last..$HEAD_SHA"
            else
              echo "Last reviewed commit $last is '$status' against $HEAD_SHA; reviewing the whole PR."
            fi
          else
            echo "No previous review found; reviewing the whole PR."
          fi

          if [ -n "$base" ]; then
            scope=$(printf '%s\n' \
              "The commits before $base have already been reviewed, in the comments above." \
              "Review ONLY what has arrived since, which you get with:" \
              "" \
              "    gh api repos/$REPO/compare/$base...$HEAD_SHA -H 'Accept: application/vnd.github.diff'" \
              "" \
              "If that call fails because the range is too large, fall back to 'gh pr diff $PR' and say in your summary that you reviewed the whole PR instead." \
              "Do not re-report a problem in code outside that range - but do read that code, and the rest of each file, for the context needed to judge the new hunks. A change is often only wrong in combination with an earlier one." \
              "If the range includes a merge from the base branch, the commits it brings in were reviewed on their own pull request; judge this author's commits.")
          else
            scope=$(printf '%s\n' \
              "There is no earlier review to carry on from - either this is the first review of this pull request, or its history was rewritten since the last one - so review the whole diff:" \
              "" \
              "    gh pr diff $PR")
          fi

          {
            echo "scope<<CLAUDE_SCOPE_EOF"
            printf '%s\n' "$scope"
            echo "CLAUDE_SCOPE_EOF"
          } >> "$GITHUB_OUTPUT"

      # The review pulls the diff through gh, but reads the working tree for
      # context (AGENTS.md, surrounding code).
      - uses: actions/checkout@v6
        if: steps.scope.outputs.skip != 'true'
        with:
          fetch-depth: 1

      # The Freya fork is a git dependency now, not part of the checkout - but it is
      # still the ground truth for Freya's APIs, so the reviewer can check a claim
      # about a component, event or theme instead of guessing, and can tell a genuine
      # fork limitation from app code working around one. A shallow clone into the
      # spot the prompt names keeps that ability; `continue-on-error` because a failed
      # clone should cost the reviewer its Freya context, not the whole review. The
      # prompt tells it to say so when the tree is empty.
      - name: Fetch the Freya fork for reference
        if: steps.scope.outputs.skip != 'true'
        continue-on-error: true
        run: git clone --depth 1 https://github.com/alexparlett/freya crates/freya

      - uses: anthropics/claude-code-action@v1
        if: steps.scope.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A direct instruction, NOT `/code-review`. The skill fans the review out
          # across background subagents, and a headless run ends the moment the main
          # loop yields - so on PR #47 it dispatched five of them, said "I'll compile
          # the final findings once they report back", and the session ended there.
          # 11 minutes and $10 for a review nobody ever saw. Whatever this prompt
          # says, it must keep the work in the main loop.
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} for real bugs.

            ${{ steps.scope.outputs.scope }}

            Then read the surrounding files for context - a hunk on its own rarely says
            whether it is correct. This repository's conventions live in AGENTS.md; a change
            that contradicts them is a finding.

            Look for correctness above all: wrong or inverted conditions, off-by-one,
            unwrap/panic on reachable input, dropped errors, removed guards, broken
            callers of a changed signature, races. Every finding needs a concrete case
            where the code misbehaves - if you cannot name one, it is not a finding.
            Prefer a handful of real problems to a long list of style notes.

            One further class of finding this repository cares about: app code that
            works around a Freya limitation instead of fixing it in the fork - a rule
            AGENTS.md states in its Architecture section. The shapes are the tell - a registry or bus
            standing in for something the framework should order, a scale-factor
            correction in component code, a theme token duplicated onto a consuming
            surface because a component's own theme lacks the state, a hand-rolled
            lookalike of a built-in component, reaching past an API for a raw winit or
            objc2 handle, a `cfg`-gated platform hack outside `freya-winit`.

            Our Freya fork is checked out at `crates/freya`, so verify before you claim
            it: find the component, event or theme in `crates/freya/crates/**`, name the
            file, and say what the fork change would be. A guess about Freya's API is
            worse than no finding - the fork is also the ground truth whenever the diff
            asserts anything about Freya's behaviour. If `crates/freya` is empty, the
            fork clone failed: say so in the summary, review the rest, and do not guess
            at Freya's APIs.

            Do the whole review YOURSELF, in this conversation. Do not delegate to
            subagents and do not start background tasks: this runs headless, so the run
            ends as soon as you stop, and anything still running is discarded unread
            while you pay for it.

            One command per Bash call. Chaining with `;` or `&&` makes the whole call
            need approval, which nothing can give here, so the call just fails.

            Post the result yourself before you finish - nothing posts it for you:
              - a line-specific finding goes inline via the
                mcp__github_inline_comment__create_inline_comment tool;
              - then one summary comment with
                `gh pr comment ${{ github.event.pull_request.number }} --body "..."`,
                covering what you checked and what you found.
            If the diff is clean, say so in the summary comment - silence is
            indistinguishable from the reviewer being broken, which is how this went
            unnoticed.

            The summary comment MUST end with this line, exactly, on its own:

            <!-- claude-review-sha: ${{ github.event.pull_request.head.sha }} -->

            That marker is how the next push knows where to start, so it goes in every
            summary comment, findings or not. Leave it out and the next run reviews
            everything here a second time.

            **Budget your turns and post while you still have some.** You have a hard
            turn limit and the run dies at it with nothing published - that has already
            happened once. On a large diff, read what you need to judge the risky hunks
            rather than every file, and once you are around three quarters of the way
            through your turns, stop looking and post what you have. A partial review
            that lands beats a thorough one that doesn't.

          # TEMPORARY (with the prompt change above), so the next run is checkable:
          # show_full_output streams every message and tool result into the step log,
          # display_report puts the final report in the job summary. Both are
          # default-off. NOTE this repository is PUBLIC, so these logs are
          # world-readable; GitHub masks registered secrets and this job only reads
          # the repo's own diff, so exposure is low. Turn both off once a review
          # actually lands on a PR.
          show_full_output: true
          display_report: true
          # 40 was sized when the main loop only dispatched subagents and did no work
          # itself. Now the whole review happens here, and PR #47 spent all 40 on
          # reading (12 Read, 8 Grep, 20 Bash) and died at the cap before posting a
          # word. The real guard is `timeout-minutes: 45` above; that run took under
          # 4 minutes and $2.27, so this has room to be generous.
          claude_args: |
            --max-turns 150
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
        env:
          GH_TOKEN: ${{ github.token }}
