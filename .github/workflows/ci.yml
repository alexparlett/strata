name: CI

on:
  push:
    branches: [main]
  pull_request:

# One test run per branch. A new push supersedes the in-flight run rather than
# holding a macOS runner for a diff nobody is waiting on any more. This group only
# ever supersedes *within* a branch; serializing across branches is the job-level
# group below, and the two do different jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Two jobs, split on one axis only: whether a test needs the container runtime.
#
# Everything the shared container worker forces on a job - the repo-wide queue, the cloud
# agent, the release step, the capacity retry - is a cost the *other* tests were paying
# for no reason. They are the overwhelming majority of the suite and they are the ones
# a PR is usually waiting on, so they now run in `test`, which queues behind nothing.
# `containers` keeps the whole serialization apparatus, and it is cheap to queue: it
# builds `strata-engine` and its dependencies only, so it never compiles Skia or the Freya
# fork's UI crates the way a workspace build does.
#
# The split is drawn at the **test target**, not by taste. `crates/strata-engine/tests/
# object_store_minio.rs` (W7), `crates/strata-engine/tests/postgres_federation.rs`
# (DB-02) and `crates/strata-engine/tests/mysql_federation.rs` (EA-20) are the only files
# in the workspace that mention testcontainers, and `containers` runs those binaries
# entire (`--test <name>`), so a test added to any of them is covered without touching this
# file. `test` names the same tests in a `--skip` so it can still say `--workspace` and stay
# honest about everything else. The two do not have to be
# kept in agreement by hand: a container test that is renamed or added without updating
# the skip list is *run* by `test`, which has no container runtime, and a test that cannot
# tell a busy provider from a missing one fails loud there.
jobs:
  # The gate: both Rust jobs run only when the diff could have moved the build. A
  # docs-only change (docs/, markdown) compiles nothing and never queues for
  # the shared container worker.
  #
  # A gate *job*, deliberately not a workflow-level `paths` filter: a path-skipped
  # workflow creates no check runs at all, so the day a required status check is added
  # to main, docs-only PRs would wait forever on a check that never reports. A skipped
  # job reports as skipped, which satisfies a required check. It also fails loud in the
  # right direction: if this job itself errors, the Rust jobs are skipped but the run is
  # red - a broken filter can never read as a green run over unreviewed Rust.
  #
  # The filter list is what the build actually READS, not "*.rs": `crates/**` covers the
  # workspace; `themes/**` and `assets/**` are pulled in from
  # the repo root by `include_str!`/`include_bytes!` (the theme JSONs, the schema that
  # `schema_in_sync` compares, the fonts); and this file itself, because a CI change must
  # prove CI still works.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      # Full history: push events diff against the previous head (a PR event reads the
      # file list from the API and needs no history at all); the filter never builds
      # anything.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - 'themes/**'
              - 'assets/**'
              - '.github/workflows/ci.yml'

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # macOS, not ubuntu: the app is macOS-first (the muda menubar, the traffic-light
    # gutter, `set_window_parent`), so a green Linux build would not be evidence the
    # thing we ship compiles. It also skips the gtk/webkit apt dance the fork's own
    # Linux job needs. The repository is public, so macOS runner minutes are free.
    runs-on: macos-latest
    # A cold run compiles DataFusion and pulls Skia; warm runs are minutes. The cache
    # is best-effort, so size this for the cold case.
    timeout-minutes: 90
    steps:
      # The Freya fork is an ordinary git dependency (root Cargo.toml,
      # `[workspace.dependencies]`), pinned by Cargo.lock — cargo fetches it itself.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # Caches ~/.cargo and target/. Keyed on the lockfile, so a Freya-only
          # change (a path dep, not a lockfile entry) reuses the cache and only
          # rebuilds the fork crates.
          cache: true
          # A cancelled or failed run must not write a cache. rust-cache saves only when
          # the key is NEW, so a partial target dir stored under a key becomes that key's
          # permanent content: every later run full-matches it, skips the save, and rebuilds
          # whatever the interrupted run had not reached. That is how `test` came to restore
          # a 571 MB cache — half the size of the same key on a PR branch — and then spend
          # 22 minutes recompiling the dependency graph while `clippy` ran warm off the same
          # entry in two. The per-ref `cancel-in-progress` above generates interrupted runs
          # deliberately, so this is not a rare case; the action's own default is `true`.
          cache-on-failure: false
          # This action defaults `rustflags` to `-D warnings`, which would apply to
          # every cargo invocation in the job - including the dependency builds. The
          # first run of this workflow failed on exactly that: two long-standing
          # warnings (a dead initial assignment in `drop_confirm.rs`, an
          # unconstructed `CellRole::None`) became hard errors in a PR that changed
          # no Rust at all. Denying warnings *is* the policy now, but it belongs to
          # the clippy step below, where it is scoped to one invocation over the
          # workspace's own crates and cannot be tripped by a dependency. Empty keeps
          # RUSTFLAGS unset for the build and test steps.
          rustflags: ''

      # The lint gate. `-D warnings` after the `--` applies to this invocation only,
      # so the `rustflags: ''` above still governs the build and test steps; what is
      # denied here is the curated set in the root `Cargo.toml` `[workspace.lints]`
      # (thresholds in `clippy.toml`) plus rustc's own warnings, over workspace
      # members only - `crates/freya` is a workspace `exclude` resolved by path, and
      # `cargo clippy` runs clippy-driver over members, so the fork is never linted
      # by us and keeps answering to its own CI.
      #
      # Before `cargo test` on purpose. Clippy is check-only: no codegen, no linking,
      # no test binaries, so a lint failure lands minutes before a full test build
      # would have finished, and the dependency artifacts it does build are plain
      # rustc output the test step reuses.
      #
      # `--all-targets` so the inline `#[cfg(test)]` modules and the integration
      # tests are held to the same bar as the code they cover - most of this
      # workspace's tests live in the same file as their subject.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `--workspace` rather than a bare `cargo test`: the root sets
      # `default-members = ["crates/strata-freya"]`, so a bare run would silently skip
      # strata-core / strata-engine / strata-model and the rest. `crates/freya` is a
      # workspace `exclude` and stays out either way - the fork has its own CI.
      #
      # This is also the theme guard: strata-freya's `schema_in_sync` test fails when
      # `themes/theme.schema.json` no longer matches `theme.rs`'s REGISTRY (regenerate
      # with `UPDATE_SCHEMA=1 cargo test -p strata-freya schema_in_sync`).
      #
      # The `--skip` is the container-runtime split and nothing else: it names the tests
      # in `crates/strata-engine/tests/object_store_minio.rs` (W7),
      # `crates/strata-engine/tests/postgres_federation.rs` (DB-02) and
      # `crates/strata-engine/tests/mysql_federation.rs` (EA-20), which the `containers`
      # job below runs instead. `--skip` filters test *names*, never targets, which is why
      # this list is per-function where that job names whole binaries. This job has no
      # Testcontainers Cloud agent, so it is also the guard on the list - a container test
      # renamed or added without amending it runs here, finds no runtime and fails, which
      # is exactly what those tests are built to do rather than passing quietly.
      - name: cargo test
        run: |
          cargo test --workspace --locked -- \
            --skip a_table_over_a_source_reads_through_the_object_store \
            --skip a_database_source_registers_a_federated_catalog \
            --skip a_mysql_source_registers_a_federated_catalog

      # The published set's own gate. Two things it holds, neither of which the clippy step
      # above can:
      #
      # `#![deny(missing_docs)]` lives in each of the four crates, so an undocumented `pub`
      # item already fails the build — but only for the features that build. The
      # `strata-engine/testing` module is off by default, so it is named here.
      #
      # It is named here for the LIBRARY only. `cargo doc` selects lib and bin targets and
      # nothing else, so this step never invokes rustc on `examples/custom_source.rs`
      # whatever features it is given — measured, by breaking the example and watching this
      # step pass. Compiling the examples is the `--all-targets` in the clippy step below,
      # which is the reason that step exists and the reason it cannot be dropped as
      # redundant with this one.
      #
      # `broken_intra_doc_links` is the rustdoc lint that cannot be a compile error: a
      # `[`Foo`]` naming an item that has been renamed still compiles and renders as plain
      # text on docs.rs. Denied per-lint rather than through a blanket `-D warnings`,
      # deliberately: `private_intra_doc_links` fires ~65 times across these crates because
      # the house style has an item's docs cite the private helpers that explain it
      # (`.agent/reference/COMMENTS.md` section 3), and that is reasoning worth keeping.
      # A link to a private item degrades to plain text; a link to a *missing* item is a
      # defect, and only the second is denied. The other three catch a mangled doc comment:
      # stray HTML, a ```rust block that does not parse, and a bare URL.
      #
      # `--no-deps`, so a dependency's own doc warnings are not ours to answer for.
      - name: cargo doc (published crates)
        env:
          RUSTDOCFLAGS: >-
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::invalid_html_tags
            -D rustdoc::invalid_rust_codeblocks
            -D rustdoc::bare_urls
        run: |
          cargo doc --locked --no-deps --features strata-engine/testing \
            -p strata-model -p strata-arrow -p strata-engine -p strata-agent

      # The `testing` feature is not on in any other step, so this is the only thing that
      # holds its modules — the six conformance rings an embedder runs against their own
      # implementations, and the fixtures beside them — to the same lint bar as the rest.
      #
      # `--all-targets` is load-bearing rather than tidy: it is what compiles
      # `examples/custom_source.rs`, whose `required-features = ["testing"]` keeps it out of
      # every other step in this file. Drop this step and the example stops being built at
      # all — the `cargo doc` step above does not build it, despite naming the same feature.
      - name: cargo clippy (testing feature)
        run: cargo clippy -p strata-engine --features testing --all-targets --locked -- -D warnings

      # Each ring carries a doctest calling it the way an embedder would — from outside the
      # crate, through `strata_engine::testing::`. That is the only thing that proves the ring
      # is reachable rather than merely `pub`, and doctests are the one target `--all-targets`
      # does not build, so neither the step above nor the workspace `cargo test` runs them:
      # with the feature off the whole module is `cfg`'d out and there are no doctests to run.
      - name: cargo test --doc (testing feature)
        run: cargo test -p strata-engine --features testing --locked --doc

      # The engine with **no data sources compiled in** — the proof that a shipped source
      # reaches the engine only through the public registration an embedder calls, and that
      # its whole dependency tree rides its cargo feature. A private path from the engine
      # into a source's module would fail here and nowhere else, because every other build
      # in this workflow has the default features on.
      #
      # It is also the minimal publication unit: what an embedder gets before choosing any
      # source. `--all-targets`, so the inline tests are held to it too, and last because it
      # is the cheapest step to re-run and the least likely to be what a PR broke.
      - name: cargo check (no sources)
        run: cargo check -p strata-engine --no-default-features --all-targets --locked

  # The three container tests - the connections one (W7, MinIO) and the two database ones
  # (DB-02, PostgreSQL; EA-20, MySQL) - drive real servers, so this job, and only this job,
  # carries the cloud agent and the repo-wide queue. Behind the same gate as `test`: a
  # skipped job never enters the concurrency queue, so a docs-only PR no longer takes a turn on the
  # account's one container worker.
  containers:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Serialized across the whole repository, not per branch: Testcontainers Cloud gives
    # this account **one** worker at a time. Two runs overlapping means the second is
    # refused - `Failed to get a worker: ErrValidator: too many concurrent requests`, or
    # the same refusal arriving as a truncated response
    # (`hyper::Error(IncompleteMessage)`) - and the test fails loud exactly as it is
    # built to. Merging a PR is precisely when that overlap happens: the merge commit
    # pushes to main while other PR branches are still building, which is why main was
    # the ref that kept failing. Raising the limit is a billing decision; waiting for the
    # worker costs nothing, because a queued job holds no runner and `timeout-minutes`
    # does not start until it runs.
    #
    # `queue: max` is load-bearing. The default (`single`) keeps one pending job per
    # group and cancels any previously pending one, so a third concurrent run would be
    # silently *cancelled* rather than queued - and a cancelled run on main is no
    # coverage of main at all, which is the failure this whole change exists to stop.
    # `max` queues up to 100. It cannot be combined with `cancel-in-progress: true`;
    # superseding belongs to the per-ref group at the top of the file, which still drops
    # a stale same-branch run before it ever reaches this queue, so this level only ever
    # waits.
    concurrency:
      group: ci-testcontainers-worker
      cancel-in-progress: false
      queue: max
    runs-on: macos-latest
    # Shorter than `test`'s: this builds strata-engine and its dependencies, not the
    # workspace, so no Skia and no Freya UI crates. DataFusion is still a cold compile.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          # See the note in `test`.
          cache-on-failure: false
          # See the note in `test`: the action's `-D warnings` default would assert
          # something stricter than the check AGENTS.md section 7 describes.
          rustflags: ''

      # Before `cargo test`: GitHub's macOS images have no Docker daemon, and
      # Testcontainers Cloud supplies the runtime the test looks for in
      # `~/.testcontainers.properties`.
      - name: Setup Testcontainers Cloud Client
        uses: atomicjar/testcontainers-cloud-setup-action@v1
        with:
          token: ${{ secrets.TC_CLOUD_TOKEN }}

      # Whole binaries, not named tests: these files *are* the container split, so anything
      # added to either belongs to this job without an edit here. One `cargo test`
      # invocation, so the two targets share the build and the cloud session rather than
      # checking a worker out twice.
      - name: cargo test (containers)
        run: |
          cargo test -p strata-engine --locked \
            --test object_store_minio \
            --test postgres_federation \
            --test mysql_federation

      # **Release the cloud session at the end of the job, always.** The agent above is
      # started in the background and nothing ever tells it to stop: the runner VM is
      # torn down under it, so the session - and the worker assigned to it - stays
      # checked out on Testcontainers Cloud's side until it times out there. With one
      # worker on this account that strands the *next* run, which is how a fully
      # serialized main run still got `Failed to get a worker: ErrValidator: too many
      # concurrent requests` five minutes after the only other job had finished. The
      # job-level concurrency group above stops two live jobs colliding; it cannot do
      # anything about a session outliving the job that opened it. This step is the
      # other half, and the two are only sufficient together.
      #
      # `always()`, not `success()` or the default: a **cancelled** job is the case that
      # matters most - `cancel-in-progress` on the per-ref group means we generate those
      # deliberately, and a cancelled run kills the agent in the way least likely to
      # release anything. `always()` is the only condition that still runs then.
      - name: Release the Testcontainers Cloud session
        if: always()
        uses: atomicjar/testcontainers-cloud-setup-action@v1
        with:
          token: ${{ secrets.TC_CLOUD_TOKEN }}
          action: terminate
