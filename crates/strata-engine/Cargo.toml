[package]
name = "strata-engine"
version.workspace = true
edition = "2021"
description = "Strata's DataFusion boundary: the direct-call async `Engine` facade, the statement router, snapshots, export, profiling, the SQL language service and the project registration pass. The only crate that touches DataFusion."
license = "MIT"

[features]
default = ["postgres", "mysql"]
testing = []
postgres = [
    "dep:datafusion-table-providers-common",
    "dep:datafusion-table-providers-postgres",
    "dep:secrecy",
]
mysql = [
    "dep:datafusion-table-providers-common",
    "dep:datafusion-table-providers-mysql",
    "dep:mysql_async",
    "dep:sea-query",
    "dep:secrecy",
]

[dependencies]
strata-core = { path = "../strata-core" }
strata-model = { path = "../strata-model" }
strata-arrow = { path = "../strata-arrow" }
datafusion = "55"
datafusion-functions-json = "0.54"
datafusion-federation = { version = "0.5.5", features = ["sql"] }
datafusion-table-providers-postgres = { version = "0.13", optional = true }
datafusion-table-providers-mysql = { version = "0.13", optional = true }
mysql_async = { version = "0.37", optional = true, default-features = false, features = ["minimal"] }
sea-query = { version = "1.0", optional = true }
datafusion-table-providers-common = { version = "0.13", optional = true }
secrecy = { version = "0.10", optional = true }
object_store = { version = "0.13", features = ["aws", "gcp", "http"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-types = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
regex = "1"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
chrono = "0.4"
thiserror = "2"
tracing = "0.1.44"

[dev-dependencies]
testcontainers = { version = "0.27", features = ["properties-config"] }
testcontainers-modules = { version = "0.15", features = ["minio", "postgres", "mysql"] }
tokio-postgres = "0.7"
aws-sdk-s3 = "1"
flate2 = "1"
keyring-core = "1"

[[example]]
name = "custom_source"
required-features = ["testing"]

[lints]
workspace = true
