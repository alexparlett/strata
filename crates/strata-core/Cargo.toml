[package]
name = "strata-core"
version = "0.2.0"
edition = "2021"
description = "Strata's framework-agnostic app core: config, keymap, theme, project persistence, the OS-keystore secret store, the model-listings satellite and the updater mechanism. DataFusion-free — the engine is `strata-engine`, which depends on this crate."
license = "MIT"

[dependencies]
strata-model = { path = "../strata-model" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
preferences = "2"
app_dirs2 = "2.5"
chrono = "0.4"
tracing = "0.1.44"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
keyring-core = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "http2",
] }
semver = "1"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[lints]
workspace = true
