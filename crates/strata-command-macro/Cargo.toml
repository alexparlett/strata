[package]
name = "strata-command-macro"
version.workspace = true
edition = "2021"
description = "The #[command_router] / #[command] attribute pair behind Strata's command palette: one declaration site per command, carrying its metadata and its body together."
license = "MIT"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[lints]
workspace = true
