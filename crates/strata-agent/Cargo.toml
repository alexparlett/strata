[package]
name = "strata-agent"
version = "0.2.0"
edition = "2021"
description = "Strata's agent-access core: the read-only tool vocabulary, the `Host` seam that answers it, and the MCP server that serves it. Frontend-agnostic — no Freya, no window, no renderer."
license = "MIT"

[dependencies]
strata-core = { path = "../strata-core" }
strata-model = { path = "../strata-model" }
strata-engine = { path = "../strata-engine" }
rmcp = { version = "3.0.1", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
    "transport-io",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "macros",
    "io-std",
    "time",
] }
tokio-util = "0.7"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = "1.0"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
genai = "=0.7.0-beta.18"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["http2"] }
url = "2"

[dev-dependencies]
rmcp = { version = "3.0.1", features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1"

[lints]
workspace = true
