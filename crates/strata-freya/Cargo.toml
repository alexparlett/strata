[package]
name = "strata-freya"
version.workspace = true
edition = "2021"
description = "Strata's Freya (Skia/native) frontend — the app. Rides the shared core crates: `strata-core` for app services and `strata-engine` for the DataFusion boundary."
license = "MIT"

[dependencies]
freya = { workspace = true, features = [
  "radio",
  "query",
  "menu",
  "router",
  "plot",
  "engine",
  "markdown",
  # Our own window chrome off macOS: `borderless` is the plugin that gives an undecorated
  # window its resize bands back, `titlebar` the button component our controls are built on.
  # Both are inert on macOS, where AppKit still draws the frame — see
  # `platform::window_attributes` and `components::chrome`.
  "borderless",
  "titlebar",
] }

strata-core = { path = "../strata-core" }
strata-model = { path = "../strata-model" }
strata-arrow = { path = "../strata-arrow" }
strata-engine = { path = "../strata-engine" }

strata-agent = { path = "../strata-agent" }

tokio = { version = "1", default-features = false, features = ["sync", "macros"] }

strata-code-editor = { path = "../strata-code-editor" }

strata-command-macro = { path = "../strata-command-macro" }

tree-sitter-sequel = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlformat = "0.3"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

uuid = { version = "1", features = ["v4", "serde"] }

async-io = "2.5"

futures = "0.3"

rfd = "0.17"

[dev-dependencies]
freya-testing = { workspace = true }
datafusion = "55"
async-trait = "0.1"

[lints]
workspace = true
